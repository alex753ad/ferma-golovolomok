<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ферма Головоломок 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Полноэкранная 3D-сцена + плашки поверх. Единый «солнечный» стиль, без тёмной темы. */
:root{--leaf:#2f6b2a;--sun:#ffc93c;--paper:#fff8e8;--ink:#2b2a1f;--clay:#e2622b;--ok:#2f9e44;--bad:#d6336c;
--disp:"Fredoka","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;color-scheme:light}
html,body{height:100%;overflow:hidden;background:#9fd8ff;color:var(--ink);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
.chip{background:var(--paper);border-radius:999px;padding:8px 16px;font:700 18px var(--disp);box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f5b301 60%,#c98a00);box-shadow:inset 0 -2px 0 #b07800}
.title{font:700 22px var(--disp);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);flex-grow:1}
.act{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:64px;padding:0 28px;border:0;border-radius:18px;background:var(--clay);color:#fff;font:700 22px var(--disp);box-shadow:0 6px 0 #a3421a;animation:pop .3s}
.tip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);background:rgba(43,42,31,.78);color:#fff;padding:10px 18px;border-radius:14px;font:800 16px var(--body);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px var(--disp);color:#fff;background:#86c34f}
.fl{position:fixed;font:700 26px var(--disp);color:#fff;-webkit-text-stroke:1.5px #8a5a00;pointer-events:none;animation:up .9s forwards}
.cf{position:fixed;width:10px;height:6px;pointer-events:none;animation:fall 1.8s ease-in forwards}
.veil{position:fixed;inset:0;background:rgba(30,40,20,.45);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--paper);border-radius:24px;max-width:860px;width:100%;max-height:100%;overflow:auto;display:flex;flex-wrap:wrap;gap:20px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .25s}
.dlg .l{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:12px;align-items:center}
.face{width:64px;height:64px;border-radius:50%;flex:none}
.who b{font:700 24px var(--disp);display:block}
.who span{font-size:14px;color:#7a6a4a}
.q{font-size:20px;line-height:1.45;font-weight:700}
.hint{background:#fff1b8;border:2px solid var(--sun);border-radius:14px;padding:12px 14px;font-size:17px;font-weight:800}
.hint small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8a6a00}
.msg{font-weight:900;font-size:17px;min-height:22px}
.pad{flex:0 1 300px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ans{height:68px;border-radius:14px;border:3px solid var(--leaf);background:#fff;font:700 36px var(--disp);display:flex;align-items:center;justify-content:center}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button,.btn{height:58px;border:0;border-radius:14px;background:#fff;font:700 26px var(--disp);color:var(--ink);box-shadow:0 4px 0 #d8cfb6}
.keys button:active,.btn:active,.act:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:8px}
.row .btn{flex:1;font-size:19px}
.y{background:var(--sun)!important;box-shadow:0 4px 0 #c99a12!important}
.g{background:var(--ok)!important;color:#fff!important;box-shadow:0 4px 0 #1f6f2f!important}
.shake{animation:shake .4s}
.win{font:700 34px var(--disp);color:var(--ok)}
.prize{background:var(--leaf);color:#fff;border-radius:16px;padding:14px 18px;font:700 22px var(--disp)}
button:focus-visible{outline:3px solid #1c7ed6;outline-offset:2px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color('#9fd8ff');scene.fog=new THREE.Fog('#9fd8ff',40,80);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight('#dff3ff','#5f8f3a',.85));
const sun=new THREE.DirectionalLight('#fff2d6',1.05);sun.position.set(18,30,14);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-34,right:34,top:26,bottom:-26,far:90});sun.shadow.bias=-.0005;scene.add(sun);

const M={};const mat=(c,o={})=>M[c+JSON.stringify(o)]||(M[c+JSON.stringify(o)]=new THREE.MeshLambertMaterial({color:c,...o}));
function mesh(geo,color,x=0,y=0,z=0,o={}){const m=new THREE.Mesh(geo,mat(color,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m}
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const pick=[];let R=5;const rnd=()=>(R=(R*16807)%2147483647)/2147483647;

// ---------- земля ----------
const ground=mesh(new THREE.PlaneGeometry(160,160),'#86c34f');ground.rotation.x=-Math.PI/2;ground.castShadow=false;scene.add(ground);
function flat(w,d,color,x,z,y=.02){const m=mesh(new THREE.PlaneGeometry(w,d),color,x,y,z);m.rotation.x=-Math.PI/2;m.castShadow=false;scene.add(m);return m}
flat(70,2.2,'#e9c98a',0,0);flat(2,44,'#e9c98a',-9,0,.025);
const F1={x:-3.5,z:-6.5,w:9,d:6},F1b={x:-3.5,z:6.5,w:9,d:5},F2={x:11,z:-7.5,w:13,d:7},POND={x:12,z:7,rx:4.6,rz:3.2};
function field(f){const b=mesh(box(f.w,.25,f.d),'#8b5e3c',f.x,.12,f.z);b.castShadow=false;scene.add(b);
 for(let z=f.z-f.d/2+.6;z<f.z+f.d/2-.3;z+=.9){const r=mesh(box(f.w-.6,.12,.35),'#73492c',f.x,.3,z);r.castShadow=false;scene.add(r)}}
[F1,F1b,F2].forEach(field);
// пруд
const shore=mesh(new THREE.CircleGeometry(1,40),'#e9c98a',POND.x,.03,POND.z);shore.scale.set(POND.rx+.6,POND.rz+.6,1);shore.rotation.x=-Math.PI/2;scene.add(shore);
const water=mesh(new THREE.CircleGeometry(1,40),'#3d9be9',POND.x,.06,POND.z,{transparent:true,opacity:.9});water.scale.set(POND.rx,POND.rz,1);water.rotation.x=-Math.PI/2;water.castShadow=false;scene.add(water);
[[10.5,6],[13.5,8],[12.5,5.5]].forEach(p=>{const l=mesh(new THREE.CircleGeometry(.4,12),'#40c057',p[0],.08,p[1]);l.rotation.x=-Math.PI/2;scene.add(l)});
// трава и цветы (инстансы)
function free(x,z){const inR=(f,m=.6)=>Math.abs(x-f.x)<f.w/2+m&&Math.abs(z-f.z)<f.d/2+m;
 return !(Math.abs(z)<1.4||Math.abs(x+9)<1.3||inR(F1)||inR(F1b)||inR(F2)||Math.hypot((x-POND.x)/(POND.rx+1),(z-POND.z)/(POND.rz+1))<1||Math.hypot(x+17,z+9)<4.5||Math.hypot(x+18,z-8)<4.5)}
const tuft=new THREE.InstancedMesh(new THREE.ConeGeometry(.07,.4,3),mat('#4e9a2e'),1400),fl=new THREE.InstancedMesh(new THREE.SphereGeometry(.09,6,4),new THREE.MeshLambertMaterial(),260);
const dm=new THREE.Object3D();let ti=0,fi=0;const fc=['#ffffff','#ffd43b','#f783ac','#a5d8ff'].map(c=>new THREE.Color(c));
while(ti<1400||fi<260){const x=rnd()*60-30,z=rnd()*40-20;if(!free(x,z))continue;
 if(ti<1400){dm.position.set(x,.18,z);dm.rotation.set(rnd()*.4-.2,rnd()*3,rnd()*.4-.2);dm.updateMatrix();tuft.setMatrixAt(ti++,dm.matrix)}
 else{dm.position.set(x,.15,z);dm.rotation.set(0,0,0);dm.updateMatrix();fl.setMatrixAt(fi,dm.matrix);fl.setColorAt(fi,fc[fi%4]);fi++}}
scene.add(tuft,fl);

// ---------- постройки ----------
function roof(w,d,h,color){const g=new THREE.CylinderGeometry(0,1,1,4,1);g.rotateY(Math.PI/4);const m=mesh(g,color);m.scale.set(w*.72,h,d*.72);return m}
const house=new THREE.Group();house.add(mesh(box(6,3,4.5),'#f4dcae',0,1.5,0));const hr=roof(6.8,5.3,2.2,'#c0392b');hr.position.y=4.1;house.add(hr);
house.add(mesh(box(1.1,1.9,.1),'#8d5524',0,.95,2.27));[-1.8,1.8].forEach(x=>house.add(mesh(box(1,.9,.1),'#74c0fc',x,1.8,2.27)));
house.add(mesh(box(.6,1.6,.6),'#a12d22',1.6,4.6,-.6));house.position.set(-17,0,-9);scene.add(house);
const barn=new THREE.Group();barn.add(mesh(box(5.5,3.4,4.5),'#c92a2a',0,1.7,0));const br=roof(6.2,5.3,1.8,'#7a1f1f');br.position.y=4.3;barn.add(br);
barn.add(mesh(box(2,2.4,.1),'#ffffff',0,1.2,2.27));barn.position.set(-18,0,8);barn.rotation.y=.4;scene.add(barn);
const puffs=[0,1,2,3].map(i=>{const p=mesh(new THREE.SphereGeometry(.35,8,6),'#ffffff',0,0,0,{transparent:true});p.castShadow=false;scene.add(p);return p});
// рынок
const stall=new THREE.Group();stall.add(mesh(box(3.6,1,1.2),'#b5651d',0,.5,0));for(let i=0;i<6;i++)stall.add(mesh(box(.62,.08,1.6),i%2?'#ffffff':'#e03131',-1.55+i*.62,2.2,-.1));
[-1.6,1.6].forEach(x=>stall.add(mesh(box(.12,2.2,.12),'#7a4b24',x,1.1,.5)));
['#ff922b','#e03131','#94d82d'].forEach((c,i)=>{for(let k=0;k<3;k++)stall.add(mesh(new THREE.SphereGeometry(.17,8,6),c,-1+i*1+k*.25-.25,1.15,.1))});
stall.position.set(-2,0,14.5);scene.add(stall);
// трактор
const tractor=new THREE.Group();tractor.add(mesh(box(2.4,1,1.4),'#2b8a3e',0,1,0));tractor.add(mesh(box(1.2,1.2,1.3),'#37b24d',-.5,2,0));
tractor.add(mesh(box(.9,.7,1.32),'#a5d8ff',-.5,2.1,0));
const wh=(r,x,z)=>{const w=mesh(new THREE.CylinderGeometry(r,r,.4,16),'#212529',x,r,z);w.rotation.x=Math.PI/2;tractor.add(w);const h=mesh(new THREE.CylinderGeometry(r*.45,r*.45,.42,12),'#ffd43b',x,r,z);h.rotation.x=Math.PI/2;tractor.add(h)};
wh(.85,-.6,.85);wh(.85,-.6,-.85);wh(.5,1,.8);wh(.5,1,-.8);tractor.add(mesh(new THREE.CylinderGeometry(.08,.08,.8,8),'#555555',.8,1.8,.3));
tractor.position.set(7.5,0,2.8);tractor.rotation.y=-.5;scene.add(tractor);
const tsmoke=[0,1,2].map(()=>{const p=mesh(new THREE.SphereGeometry(.25,8,6),'#777777',0,0,0,{transparent:true});p.castShadow=false;scene.add(p);return p});
// деревья
const trees=[];[[-26,-15],[-22,-17],[-27,-3],[-26,13],[-21,16],[-12,17],[4,17],[8,16],[24,15],[27,4],[27,-8],[25,-17],[18,-17],[3,-15],[-9,-16],[-27,6],[17,2],[-13,9]].forEach(p=>{
 const t=new THREE.Group(),s=.9+rnd()*.5;t.add(mesh(new THREE.CylinderGeometry(.22,.3,1.6,7),'#7a4b24',0,.8,0));
 [[0,2.2,0,1.2,'#3d8b37'],[.6,1.8,.3,.8,'#2f7d32'],[-.5,1.9,-.3,.85,'#47a03f'],[0,2.9,0,.75,'#5cb85c']].forEach(c=>t.add(mesh(new THREE.IcosahedronGeometry(c[3],0),c[4],c[0],c[1],c[2],{flatShading:true})));
 t.position.set(p[0],0,p[1]);t.scale.setScalar(s);t.rotation.y=rnd()*6;t.userData.k=rnd()*6;scene.add(t);trees.push(t)});
// облака
const clouds=[0,1,2,3,4].map(i=>{const c=new THREE.Group();for(let k=0;k<4;k++){const s=mesh(new THREE.SphereGeometry(1.4+rnd(),10,8),'#ffffff',k*1.5-2,rnd()*.6,rnd()*1.4-.7);s.receiveShadow=false;c.add(s)}
 c.position.set(-40+i*18,16+rnd()*3,-14+rnd()*24);scene.add(c);return c});

// ---------- урожай ----------
const stalkG=new THREE.CylinderGeometry(.03,.04,.9,4),earG=new THREE.SphereGeometry(.09,6,4);earG.scale(1,2.2,1);
const crops=[];for(let r=0;r<5;r++)for(let c=0;c<8;c++){const g=new THREE.Group();
 [[-.15,0],[.15,.05],[0,-.15],[.05,.15]].forEach(o=>{g.add(mesh(stalkG,'#c9a227',o[0],.45,o[1]));g.add(mesh(earG,'#f2c230',o[0],1,o[1]))});
 g.position.set(F1.x-3.7+c*1.06,.25,F1.z-2.2+r*1.1);g.userData={crop:true,ripe:true,k:rnd()*6};scene.add(g);crops.push(g)}
const sproutG=new THREE.SphereGeometry(.16,6,4);sproutG.scale(1.5,.6,.8);
function sprouts(f,cols,rows,arr){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const g=new THREE.Group();
 const a=mesh(sproutG,'#69db7c',-.14,.18,0);a.rotation.z=.6;const b=mesh(sproutG,'#69db7c',.14,.18,0);b.rotation.z=-.6;g.add(a,b);
 g.position.set(f.x-f.w/2+.7+c*(f.w-1.4)/(cols-1),.28,f.z-f.d/2+.7+r*(f.d-1.4)/(rows-1));scene.add(g);arr.push(g)}}
const sp1=[],sp2=[];sprouts(F1b,8,4,sp1);sprouts(F2,11,5,sp2);sp2.forEach(s=>s.scale.setScalar(.001));

// ---------- забор и табличка ----------
const fence=new THREE.Group();const fx=F2.w/2+.5,fz=F2.d/2+.5;
for(let x=-fx;x<=fx+.01;x+=1.4){fence.add(mesh(box(.18,1.1,.18),'#7a4b24',x,.55,-fz));fence.add(mesh(box(.18,1.1,.18),'#7a4b24',x,.55,fz))}
for(let z=-fz;z<=fz+.01;z+=1.4){fence.add(mesh(box(.18,1.1,.18),'#7a4b24',-fx,.55,z));fence.add(mesh(box(.18,1.1,.18),'#7a4b24',fx,.55,z))}
[.4,.85].forEach(y=>{fence.add(mesh(box(fx*2,.1,.08),'#a0703c',0,y,-fz));fence.add(mesh(box(fx*2,.1,.08),'#a0703c',0,y,fz));fence.add(mesh(box(.08,.1,fz*2),'#a0703c',-fx,y,0));fence.add(mesh(box(.08,.1,fz*2),'#a0703c',fx,y,0))});
fence.position.set(F2.x,0,F2.z);scene.add(fence);
function label(lines,w,h,bg,fg,scale){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);
 x.fillStyle=bg;x.beginPath();x.roundRect?x.roundRect(2,2,w-4,h-4,h/3):x.rect(2,2,w-4,h-4);x.fill();x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';
 lines.forEach((l,i)=>{x.font=l[1];x.fillText(l[0],w/2,h/(lines.length+1)*(i+1)+(lines.length>1?(i?-4:4):0))});
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(w*scale,h*scale,1);return s}
const sign=label([['Поле 2 закрыто','700 30px Fredoka, sans-serif'],['Реши задачу Петровича','800 18px Nunito, sans-serif']],300,96,'#fff8e8','#2b2a1f',.016);
sign.position.set(F2.x,2.6,F2.z);scene.add(sign);

// ---------- персонажи ----------
function person(o){const g=new THREE.Group(),parts={};
 const leg=x=>{const p=new THREE.Group();p.position.set(x,.75,0);p.add(mesh(box(.22,.7,.24),o.pants,0,-.35,0));p.add(mesh(box(.24,.14,.34),'#4a3020',0,-.68,.05));g.add(p);return p};
 parts.l=leg(-.15);parts.r=leg(.15);
 g.add(mesh(new THREE.CylinderGeometry(.3,.34,.78,12),o.shirt,0,1.12,0));
 const arm=x=>{const p=new THREE.Group();p.position.set(x,1.42,0);p.add(mesh(box(.15,.55,.15),o.shirt,0,-.27,0));p.add(mesh(new THREE.SphereGeometry(.1,8,6),o.skin,0,-.6,0));g.add(p);return p};
 parts.al=arm(-.42);parts.ar=arm(.42);
 g.add(mesh(new THREE.SphereGeometry(.32,16,12),o.skin,0,1.8,0));
 [-.11,.11].forEach(x=>{g.add(mesh(new THREE.SphereGeometry(.045,8,6),'#2b2a1f',x,1.84,.28));g.add(mesh(new THREE.SphereGeometry(.06,8,6),'#ff9a9a',x*1.6,1.72,.24))});
 if(o.beard){const b=mesh(new THREE.SphereGeometry(.22,10,8),'#f1f3f5',0,1.62,.16);b.scale.set(1.1,.8,.7);g.add(b)}
 if(o.hat=='straw'){g.add(mesh(new THREE.CylinderGeometry(.6,.6,.05,20),'#e9c46a',0,2.04,0));g.add(mesh(new THREE.CylinderGeometry(.28,.32,.3,16),'#e9c46a',0,2.2,0));g.add(mesh(new THREE.CylinderGeometry(.33,.33,.07,16),'#c0392b',0,2.1,0))}
 if(o.hat=='cap'||o.hat=='boy'){g.add(mesh(new THREE.SphereGeometry(.34,14,8,0,Math.PI*2,0,Math.PI/2),o.hatC,0,1.9,0));g.add(mesh(box(.42,.05,.32),o.hatC,0,1.93,.38))}
 if(o.hat=='boy')[-.2,.2].forEach(x=>g.add(mesh(box(.08,.2,.2),'#7a4b24',x*1.4,1.78,-.05)));
 if(o.hat=='scarf'){g.add(mesh(new THREE.SphereGeometry(.36,14,8,0,Math.PI*2,0,Math.PI/1.8),o.hatC,0,1.82,-.03));g.add(mesh(new THREE.SphereGeometry(.12,8,6),o.hatC,0,1.55,-.2))}
 const tag=label([[o.name,'800 26px Nunito, sans-serif']],o.name.length*14+30,44,o.me?'#1971c2':'#ffffff',o.me?'#ffffff':'#2b2a1f',.013);tag.position.y=2.75;g.add(tag);
 g.userData.parts=parts;g.position.set(o.x,0,o.z);scene.add(g);return g}
const npcs=[
 {id:'mat',name:'Дед Матвей',x:-11.5,z:-2.4,shirt:'#5c7cfa',pants:'#495057',hat:'straw',beard:true,skin:'#f1c27d'},
 {id:'pet',name:'Механик Петрович',x:5,z:1.8,shirt:'#f76707',pants:'#364fc7',hat:'cap',hatC:'#364fc7',skin:'#e0ac69'},
 {id:'val',name:'Тётя Валя',x:-2,z:12.4,shirt:'#e64980',pants:'#862e9c',hat:'scarf',hatC:'#fcc419',skin:'#f1c27d'}];
npcs.forEach(n=>{n.g=person(n);n.g.lookAt(-3,0,0.5);n.g.traverse(m=>{if(m.isMesh){m.userData.npc=n.id;pick.push(m)}})});
const bang=label([['!','700 56px Fredoka, sans-serif']],70,70,'#ffc93c','#2b2a1f',.012);bang.position.set(0,3.4,0);npcs[1].g.add(bang);
const lev=person({name:'Лев',me:true,shirt:'#ffd43b',pants:'#1864ab',hat:'boy',hatC:'#1971c2',skin:'#f1c27d',x:-3,z:.6});
const P={tx:-3,tz:.6,moving:false,goal:null,ph:0};

// ---------- бабочки ----------
const wingG=new THREE.CircleGeometry(.14,8);const flies=['#ffd43b','#ffffff','#ff8787','#74c0fc'].map((c,i)=>{const g=new THREE.Group();
 const a=mesh(wingG,c,-.12,0,0,{side:THREE.DoubleSide}),b=mesh(wingG,c,.12,0,0,{side:THREE.DoubleSide});g.add(a,b);g.userData={a,b,x:-12+i*8,z:-12+i*7,p:i*2};scene.add(g);return g});

// ---------- логика ----------
let coins=120,solved=5,unlocked=false,unlockT=0;
const blocks=[{x:-17,z:-9,w:7,d:5.5},{x:-18,z:8,w:6.5,d:5.5},{x:-2,z:14.5,w:4,d:1.8},{x:7.5,z:2.8,w:3,d:2.4}];
function blocked(x,z){if(Math.abs(x)>29||Math.abs(z)>19)return true;if(blocks.some(b=>Math.abs(x-b.x)<b.w/2&&Math.abs(z-b.z)<b.d/2))return true;
 if(Math.hypot((x-POND.x)/POND.rx,(z-POND.z)/POND.rz)<1)return true;return !unlocked&&Math.abs(x-F2.x)<F2.w/2+.7&&Math.abs(z-F2.z)<F2.d/2+.7}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),tip=$('tip'),act=$('act'),veil=$('veil'),dlg=$('dlg');
renderer.domElement.addEventListener('pointerdown',e=>{if(!veil.hidden)return;tip.hidden=true;
 ndc.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ndc,camera);
 const hit=ray.intersectObjects([...pick,...crops.filter(c=>c.userData.ripe)],true)[0];
 if(hit){let o=hit.object;while(o.parent&&!o.userData.crop&&!o.userData.npc)o=o.parent;
  if(o.userData.crop){if(lev.position.distanceTo(o.position)<4){harvest(o);return}}
  else if(o.userData.npc){const n=npcs.find(n=>n.id==o.userData.npc);const d=new THREE.Vector3().subVectors(lev.position,n.g.position).setY(0).normalize().multiplyScalar(1.4);
   P.tx=n.g.position.x+d.x;P.tz=n.g.position.z+d.z;P.goal=n.id;P.moving=true;return}}
 const g=ray.intersectObject(ground)[0];if(g){P.tx=g.point.x;P.tz=g.point.z;P.goal=null;P.moving=true}});
function harvest(c){c.userData.ripe=false;c.children.forEach((m,i)=>{if(i%2)m.visible=false;else m.scale.y=.25});coins+=2;upd();
 const v=c.position.clone().setY(1.6).project(camera);const f=document.createElement('div');f.className='fl';f.textContent='+2';
 f.style.left=(v.x+1)/2*innerWidth-14+'px';f.style.top=(1-v.y)/2*innerHeight-20+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
act.onclick=()=>openNpc(act.dataset.id);
function upd(){$('coins').textContent=coins;$('solved').textContent=solved}

const camPos=new THREE.Vector3(-3,10,12),look=new THREE.Vector3();const clock=new THREE.Clock();
function tick(){const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 const p=lev.position,parts=lev.userData.parts;
 if(P.moving){const dx=P.tx-p.x,dz=P.tz-p.z,d=Math.hypot(dx,dz),sp=5.5*dt;
  if(d<sp){p.x=P.tx;p.z=P.tz;P.moving=false;if(P.goal){openNpc(P.goal);P.goal=null}}
  else{const nx=p.x+dx/d*sp,nz=p.z+dz/d*sp;if(blocked(nx,nz)){P.moving=false;P.goal=null}else{p.x=nx;p.z=nz;P.ph+=dt*11;
   const a=Math.atan2(dx,dz);let r=a-lev.rotation.y;r=Math.atan2(Math.sin(r),Math.cos(r));lev.rotation.y+=r*Math.min(1,dt*12)}}}
 const sw=P.moving?Math.sin(P.ph)*.7:0;parts.l.rotation.x=sw;parts.r.rotation.x=-sw;parts.al.rotation.x=-sw*.8;parts.ar.rotation.x=sw*.8;lev.position.y=P.moving?Math.abs(Math.sin(P.ph))*.08:0;
 npcs.forEach((n,i)=>{const u=n.g.userData.parts;u.ar.rotation.z=n.id=='pet'&&!unlocked?Math.sin(t*6)*.4+.3:Math.sin(t*1.5+i)*.06;n.g.position.y=Math.sin(t*2+i)*.02});
 bang.position.y=3.3+Math.abs(Math.sin(t*3))*.3;bang.visible=!unlocked;
 crops.forEach(c=>{if(c.userData.ripe){c.rotation.z=Math.sin(t*1.6+c.userData.k)*.06;c.rotation.x=Math.cos(t*1.3+c.userData.k)*.05}});
 sp1.forEach((s,i)=>s.rotation.z=Math.sin(t*2+i)*.08);
 trees.forEach(tr=>tr.rotation.z=Math.sin(t*.9+tr.userData.k)*.015);
 clouds.forEach(c=>{c.position.x+=dt*.9;if(c.position.x>45)c.position.x=-45});
 puffs.forEach((s,i)=>{const k=(t*.35+i/4)%1;s.position.set(-15.4+Math.sin(k*6+i)*.3,5.4+k*3,-9.6);s.scale.setScalar(.6+k*1.4);s.material.opacity=.7*(1-k)});
 tsmoke.forEach((s,i)=>{const k=(t*.6+i/3)%1;s.visible=!unlocked;s.position.set(7.9,2.3+k*2.2,3.1);s.scale.setScalar(.6+k*1.6);s.material.opacity=.6*(1-k)});
 flies.forEach(f=>{const u=f.userData;u.p+=dt*.6;f.position.set(u.x+Math.sin(u.p)*4,1.2+Math.sin(u.p*3)*.4,u.z+Math.sin(u.p*1.7)*3);const w=Math.sin(t*22+u.p)*.9;u.a.rotation.y=w;u.b.rotation.y=-w;f.rotation.y=u.p});
 water.material.color.setHSL(.58,.75,.56+Math.sin(t*1.2)*.03);
 if(unlocked&&unlockT<1){unlockT=Math.min(1,unlockT+dt*.6);fence.position.y=-1.2*unlockT;sign.material.opacity=1-unlockT;sp2.forEach((s,i)=>s.scale.setScalar(Math.max(.001,Math.min(1,unlockT*2-i/sp2.length))))}
 const near=npcs.find(n=>n.g.position.distanceTo(p)<2.6);act.hidden=!near||!veil.hidden;if(near){act.textContent='Говорить: '+near.name.split(' ').pop();act.dataset.id=near.id}
 camPos.lerp(new THREE.Vector3(p.x,p.y+9.5,p.z+11.5),Math.min(1,dt*3));camera.position.copy(camPos);look.lerp(new THREE.Vector3(p.x,1,p.z),Math.min(1,dt*4));camera.lookAt(look);
 renderer.render(scene,camera);requestAnimationFrame(tick)}
look.set(-3,1,.6);$('load').remove();tick();

// ---------- диалоги и задача ----------
const face=n=>`<svg class="face" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="${n.shirt}"/><circle cx="32" cy="36" r="18" fill="${n.skin}"/><circle cx="26" cy="35" r="2.5" fill="#2b2a1f"/><circle cx="38" cy="35" r="2.5" fill="#2b2a1f"/>${n.beard?'<path d="M20 42a12 12 0 0 0 24 0z" fill="#f1f3f5"/>':''}</svg>`;
const T={q:'Лев, пока я чиню трактор, по столбу лезет улитка. Высота столба — 10 м. Днём она поднимается на 3 м, а ночью сползает на 2 м. На какой день улитка доберётся до верха?',a:'8',
 h:['На сколько метров улитка поднимается за полные сутки?','В последний день ей не нужно сползать: она уже наверху.'],
 sol:'За сутки улитка поднимается на 1 м. После 7 суток она на высоте 7 м, а в 8-й день поднимается ещё на 3 м и оказывается наверху.'};
let ans='',hints=0;
function openNpc(id){const n=npcs.find(n=>n.id==id);veil.hidden=false;act.hidden=true;
 if(id=='pet'&&!unlocked){ans='';hints=0;renderTask(n);return}
 const say={mat:'Пшеница поспела! Подойди к полю и нажимай на колоски — соберёшь урожай.',val:'Приноси урожай на рынок — куплю по хорошей цене!',pet:'Трактор починили, поле открыто. Скоро будут новые задачи!'}[id];
 dlg.innerHTML=`<div class="l"><div class="who">${face(n)}<div><b>${n.name}</b></div></div><div class="q">${say}</div><div class="row"><button class="btn g" id="ok">Хорошо</button></div></div>`;
 $('ok').onclick=close}
function close(){veil.hidden=true}
function renderTask(n){dlg.innerHTML=`<div class="l"><div class="who">${face(n)}<div><b>${n.name}</b><span>Задача 6 из 20 · награда: Поле 2</span></div></div>
 <div class="q">${T.q}</div><div id="hb"></div><div class="msg" id="msg"></div></div>
 <div class="pad"><div class="ans" id="ans" aria-live="polite">?</div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button data-k="del" aria-label="Стереть">⌫</button><button data-k="0">0</button><button data-k="x" aria-label="Закрыть">✕</button></div>
 <div class="row"><button class="btn y" id="hint">Подсказка</button><button class="btn g" id="chk">Проверить</button></div></div>`;
 dlg.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='x')return close();if(k=='del')ans=ans.slice(0,-1);else if(ans.length<4)ans+=k;$('ans').textContent=ans||'?'});
 $('hint').onclick=showHint;$('chk').onclick=check}
function showHint(){if(hints<2)hints++;$('hb').innerHTML=T.h.slice(0,hints).map((h,i)=>`<div class="hint" style="margin-bottom:8px"><small>Подсказка ${i+1} из 2</small>${h}</div>`).join('')}
function check(){if(!ans)return;
 if(ans==T.a){solved++;coins+=30;unlocked=true;upd();boom();
  dlg.innerHTML=`<div class="l"><div class="win">Верно! Ответ: 8</div><div class="prize">Награда: Поле 2 открыто · +30 монет</div><div class="q" style="font-size:18px">${T.sol}</div><div class="row"><button class="btn g" id="ok">На ферму</button></div></div>`;
  $('ok').onclick=close}
 else{dlg.classList.remove('shake');void dlg.offsetWidth;dlg.classList.add('shake');const m=$('msg');m.style.color='var(--bad)';m.textContent='Не совсем. Попробуй ещё раз!';ans='';$('ans').textContent='?';if(hints<2)showHint()}}
function boom(){const cs=['#ffc93c','#e2622b','#2f9e44','#1c7ed6','#e64980'];for(let i=0;i<90;i++){const d=document.createElement('div');d.className='cf';d.style.background=cs[i%5];
 d.style.left=innerWidth/2+'px';d.style.top=innerHeight/2+'px';d.style.setProperty('--dx',(Math.random()-.5)*innerWidth+'px');d.style.setProperty('--dy',(Math.random()*.6-.1)*innerHeight+'px');d.style.animationDelay=Math.random()*.2+'s';
 document.body.appendChild(d);setTimeout(()=>d.remove(),2100)}}
</script>

</body></html>
